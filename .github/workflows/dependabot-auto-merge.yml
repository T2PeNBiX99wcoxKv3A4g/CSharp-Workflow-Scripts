name: Dependabot auto-merge

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  automerge:
    runs-on: ubuntu-latest

    steps:
      - name: Check pull request
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR=$(gh api \
            "/repos/${{ github.repository }}/pulls/$PR_NUMBER")

          AUTHOR=$(echo "$PR" | jq -r '.user.login')
          MERGEABLE=$(echo "$PR" | jq -r '.mergeable')
          MERGEABLE_STATE=$(echo "$PR" | jq -r '.mergeable_state')

          echo "Author: $AUTHOR"
          echo "Mergeable: $MERGEABLE"
          echo "Mergeable state: $MERGEABLE_STATE"

          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"
          echo "mergeable=$MERGEABLE" >> "$GITHUB_OUTPUT"
          echo "mergeable_state=$MERGEABLE_STATE" >> "$GITHUB_OUTPUT"

      - name: Comment on non-Dependabot pull request
        if: steps.check.outputs.author != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            -f body='This pull request will not be automatically merged because it was not opened by Dependabot.'

      - name: Comment on merge conflict
        if: >
          steps.check.outputs.author == 'dependabot[bot]' &&
          (
            steps.check.outputs.mergeable == 'false' ||
            steps.check.outputs.mergeable_state == 'dirty'
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            -f body='This Dependabot pull request has merge conflicts and cannot be automatically merged. Please resolve the conflicts manually.'

      - name: Approve Dependabot pull request
        if: >
          steps.check.outputs.author == 'dependabot[bot]' &&
          steps.check.outputs.mergeable != 'false' &&
          steps.check.outputs.mergeable_state != 'dirty'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" \
            -f event='APPROVE' \
            -f body='Automatically approved because this pull request was opened by Dependabot.'

      - name: Enable GitHub auto-merge
        if: >
          steps.check.outputs.author == 'dependabot[bot]' &&
          steps.check.outputs.mergeable != 'false' &&
          steps.check.outputs.mergeable_state != 'dirty'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api graphql \
            -f query='
              mutation($pullRequestId: ID!) {
                enablePullRequestAutoMerge(
                  input: {
                    pullRequestId: $pullRequestId
                    mergeMethod: MERGE
                  }
                ) {
                  pullRequest {
                    number
                    autoMergeRequest {
                      enabledAt
                      mergeMethod
                    }
                  }
                }
              }
            ' \
            -F pullRequestId="$(gh api \
              "/repos/${{ github.repository }}/pulls/$PR_NUMBER" \
              --jq '.node_id')"